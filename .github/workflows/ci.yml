name: CI
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verificacion:
    uses: davidbp845/metodo/.github/workflows/verificacion.yml@main
    permissions:
      contents: write
    with:
      python-version: "3.14"
      instalar: pip install -r requirements.txt -r requirements-dev.txt
      verificacion: |
        python -m pytest
        ruff check .
      rama-verificada: produccion
