[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # isort (orden de imports)
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]

[tool.ruff.lint.per-file-ignores]
# streamlit_app/app.py necesita insertar la raíz del repo en sys.path
# antes de importar domain/adapters (ver comentario en el propio
# fichero) — el import fuera de la cabecera es intencional.
"streamlit_app/app.py" = ["E402"]
